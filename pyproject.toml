[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "viddown"
version = "0.1.0"
description = "VidDown – stahování videí ze stránek, playlistů a kanálů (yt-dlp + HLS sniffer), CLI, webové GUI a Telegram bot"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "playwright>=1.49",
    "psutil>=5.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pyinstaller>=6.10"]

[project.scripts]
viddown = "viddown.bootstrap:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
viddown = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
