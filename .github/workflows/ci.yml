name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: ffmpeg
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then sudo apt-get update && sudo apt-get install -y ffmpeg; fi
          if [ "$RUNNER_OS" = "macOS" ]; then brew install ffmpeg; fi
          if [ "$RUNNER_OS" = "Windows" ]; then choco install ffmpeg -y --no-progress; fi
      - name: Instalace
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          python -m playwright install --with-deps chromium-headless-shell
      - name: Testy
        run: python -m pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Sestavení obrazu
        run: docker build -t viddown:ci .
      - name: Kouřový test
        run: |
          docker run -d --name vd -p 127.0.0.1:8765:8765 -e VIDDOWN_ALLOW_NO_PASSWORD=1 viddown:ci
          for i in $(seq 1 40); do curl -sf http://127.0.0.1:8765/api/session && break; sleep 2; done
          curl -sf http://127.0.0.1:8765/api/state
          docker logs vd

  package:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sestavení balíčku
        run: |
          pip install -e ".[dev]"
          pyinstaller --noconfirm packaging/viddown.spec
      - name: Archiv (macOS)
        if: runner.os == 'macOS'
        run: cd dist && ditto -c -k --keepParent VidDown.app VidDown-macOS.zip
      - name: Archiv (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist/viddown -DestinationPath dist/VidDown-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: VidDown-${{ runner.os }}
          path: dist/VidDown-*.zip
