# VidDown na Synology NAS (Container Manager › Projekt › Vytvořit › Vytvořit docker-compose.yml).
# Návod krok za krokem je v README (Instalace › Synology NAS). Obraz je veřejný, přihlašovat se nikam nemusíte.
#
# Upravte jen tři věci:
#   1) VIDDOWN_PASSWORD – heslo do aplikace (aspoň 6 znaků),
#   2) cestu ke složce pro videa (řádek s /downloads),
#   3) PUID/PGID jen když aplikace hlásí, že do složky nejde zapisovat (viz README › Když něco nefunguje).
services:
  viddown:
    image: ghcr.io/iamjk78/viddown:latest
    container_name: viddown
    restart: unless-stopped
    ports:
      - "8765:8765"          # aplikace: http://<adresa-NAS>:8765 (jen v domácí síti nebo přes VPN, nevystavovat do internetu)
    environment:
      TZ: Europe/Prague
      PUID: "1026"           # uživatel NAS, kterému budou patřit stažená videa (první vytvořený uživatel bývá 1026)
      PGID: "100"            # skupina „users“
      VIDDOWN_PASSWORD: "ZMENTE-TOTO-HESLO"
    volumes:
      - /volume1/docker/viddown/data:/data       # nastavení, databáze, enginy (složku vytvořte ve File Station)
      - /volume1/video/VidDown:/downloads        # sem se ukládají videa (v aplikaci je to složka /downloads)
      # - /volume1/zalohy/viddown:/backups       # volitelně: automatické zálohy (v aplikaci pak zadejte /backups)
